; ─────────────────────────────────────────────────────────────────────────────
; ansible.cfg for the RHEL patching automation.
;
; Only used for standalone `ansible-playbook` runs launched with `patching/`
; as the working directory (e.g. local testing). AAP/ansible-runner runs
; from the project root instead and never discovers this file at all -- see
; README.md "AAP path resolution". roles_path is set here for convenience
; during local runs, but roles/group_vars also resolve correctly under AAP
; without it, since they live at playbooks/roles and playbooks/group_vars
; (Ansible's built-in, config-independent search path relative to whichever
; directory holds the playbook file being run).
; ─────────────────────────────────────────────────────────────────────────────
[defaults]
inventory      = inventory/hosts.placeholder.yml
roles_path     = playbooks/roles
retry_files_enabled = False
host_key_checking   = False
stdout_callback     = default
interpreter_python  = auto_silent
timeout             = 30

[privilege_escalation]
become        = True
become_method = sudo
